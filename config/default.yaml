# 非机密默认配置 —— 公共设施报修与资产协同 · 建议服务 MVP
#
# 这个文件只放**非机密**项：默认参数、制度性未决项的当前取值。
# 口令、密钥、证书、连接串一律不进仓库（见 .gitignore）。
#
# 加载顺序：本文件覆盖代码里的 dataclass 默认值（core/config.py）。
# 阶段 0 制度确认后，在下面把待确认项逐项填实即可，不需要改代码。
#
# 解析器是项目自带的零依赖 YAML 子集（utils/yamllite.py）：
#   支持 注释 / 缩进嵌套映射 / 块状列表 / 流式列表 / 标量
#   不支持 锚点、多文档、复杂键、块标量 —— 遇到会直接报错而不是悄悄解析错

# ---------------------------------------------------------------- 运行
run:
  # 运行时 SQLite 路径（相对项目根；已被 .gitignore 排除）
  db_path: data/suggestion.db
  # 演示规模。生产按 f12/f51 放大到 14000 件设施、每日 90 张工单
  seed_assets: 2000
  seed_workorders: 300
  # f34 已授权业务状态更新周期（分钟）
  sync_period_minutes: 15

# ---------------------------------------------------------------- 制度性未决项
# 对应《首期系统设计方案》§14.3 的 12 项待确认。
# 默认一律取保守值：留空 = 不启用该机制，而不是替业务方预设口径。
policy:
  # 第 2 项：正式留存期限（暂定 90 天）、删除执行人、是否双人确认
  retention_days: 90
  auto_delete_enabled: false        # f43：删除不自动，到期只生成待复核清单
  dual_confirm_enabled: false       # f43：双人确认开关，默认关
  # 第 5 项：交接"约定时限"具体数值（未确认 → 空且不启用，只提示不自动升级）
  handover_timeout_minutes: null
  # 第 3 项：§12.3 验收硬线的抽样方法与出数责任人（未确认 → 不产出对外达标结论）
  acceptance_sampling_method: null
  acceptance_metric_owner: null

# ---------------------------------------------------------------- 匹配层参数
matching:
  # 锚定单元内的空间邻近半径（米）
  recall_radius_m: 400
  # 单通道召回条数（两通道各取此数后取并集，池上限 2×）
  recall_limit: 50
  # 阶段四输出 Top-N
  top_k: 3
  # 置信分档 δ —— 占位值。方案 §6.8 要求"先测后定"：
  # 阶段 2 用真实历史工单标定之前，这个值不可对外使用
  confidence_delta: 0.15

# ---------------------------------------------------------------- 本地模型服务
# 专网内、数据不出域。生产用 vLLM，验证期用 Ollama，两者都是 OpenAI 兼容接口。
# base_url 为空 → 自动降级为规则基线（模型版本 rule-baseline-v1），业务不中断。
llm:
  base_url: null
  model: qwen2.5:7b
  timeout_s: 30
  enabled: false

# ---------------------------------------------------------------- 授权范围
# f41：只有授权的业务岗位可以查看五类资料。
# 键是岗位，值是该岗位可查看的资料类型。
material_scopes:
  巡查工作人员:
    - 设施地图
    - 照片
    - 历史维修
  维修协调员:
    - 设施地图
    - 照片
    - 历史维修
    - 迁移记录
    - 验收凭证
  资产平台工程师:
    - 设施地图
    - 照片
    - 历史维修
    - 迁移记录
    - 验收凭证
  设施安全监督员:
    - 设施地图
    - 照片
    - 历史维修
    - 迁移记录
    - 验收凭证
  社区服务代表:
    - 历史维修
  设施运营主任:
    - 设施地图
    - 照片
    - 历史维修
    - 迁移记录
    - 验收凭证
