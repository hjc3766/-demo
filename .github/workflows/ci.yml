name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 语法检查
        run: python -m compileall -q src tests examples

      - name: 单元测试
        run: python -m asset_suggestion test

      - name: 冒烟（回放链路，错误数必须为 0）
        run: |
          python -m asset_suggestion seed --assets 400 --workorders 30
          python -m asset_suggestion replay -n 30

  config:
    name: 配置与打包自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: config/default.yaml 必须能被自带的 YAML 子集解析器读通
        run: |
          export PYTHONPATH="$PWD/src"
          python - <<'PY'
          from asset_suggestion.core.config import CONFIG
          assert CONFIG.db_path, "db_path 未解析"
          assert CONFIG.top_k == 3, CONFIG.top_k
          assert CONFIG.auto_delete_enabled is False, "制度性未决项默认值必须是保守值"
          assert CONFIG.dual_confirm_enabled is False, "制度性未决项默认值必须是保守值"
          assert CONFIG.handover_timeout_minutes is None, "交接约定时限未确认，必须留空"
          assert CONFIG.acceptance_metric_owner is None, "出数责任人未确认，必须留空"
          print("配置自检通过：", CONFIG.db_path)
          PY

      - name: 构建产物
        # 用 `bash <脚本>` 而不是 `./scripts/build.sh`：不依赖文件执行位，
        # 避免 Windows 贡献者提交时丢失可执行位导致 Permission denied
        run: bash ./scripts/build.sh
